<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Exercise Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Full viewport split-screen body */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222;
            display: flex;
            height: 100vh; /* Spans full height of the browser screen */
            overflow: hidden;
        }

        /* Left Sidebar: Fixed width, full height, with full-height border */
        aside {
            width: 320px;
            background-color: #ffffff;
            border-right: 1px solid #e5e5e5; /* Extends fully from top to bottom */
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            padding-left: 20px; /* Aligns content away from extreme left edge if desired, or set to 20px */
            padding-right: 15px;
        }

        .sidebar-header {
            padding: 24px 0 18px 0;
            background-color: #ffffff;
            color: #111111;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #e5e5e5;
        }

        .menu-container {
            padding: 20px 0;
        }

        /* Collapsible Section Details */
        details {
            margin-bottom: 10px;
        }

        summary {
            padding: 8px 10px;
            font-weight: bold;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        summary:hover {
            color: #0056b3;
        }

        /* Subsections & Exercise List */
        .subsection-list {
            list-style: none;
            padding-left: 12px;
            margin-top: 6px;
        }

        .exercise-item {
            padding: 7px 10px;
            margin-bottom: 3px;
            background-color: #ffffff;
            border: none;
            cursor: pointer;
            font-size: 0.88rem;
            color: #444444;
        }

        .exercise-item:hover {
            color: #000000;
            font-weight: bold;
        }

        /* Right Content Area: Expands to fill remaining screen space */
        main {
            flex-grow: 1;
            padding: 40px 60px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .content-card {
            max-width: 800px;
        }

        h1 { margin-bottom: 12px; color: #111111; font-size: 1.6rem; }
        p { line-height: 1.6; color: #444444; margin-bottom: 20px; font-size: 0.95rem; }
        
        .code-preview {
            background-color: #f9f9f9;
            border: 1px solid #e5e5e5;
            padding: 15px;
            font-family: monospace;
            font-size: 0.88rem;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #111111;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { background-color: #444444; }
    </style>
</head>
<body>

    <!-- Left Sidebar (Split Pane 1) -->
    <aside>
        <div class="sidebar-header">My Exercises</div>
        <div class="menu-container">

            <!-- Section 1 -->
            <details open>
                <summary>Econometrics & MATLAB</summary>
                <ul class="subsection-list">
                    <li class="exercise-item" onclick="loadContent('ex1')">Exercise 1: Monte Carlo Simulation</li>
                    <li class="exercise-item" onclick="loadContent('ex2')">Exercise 2: Bootstrap Methods</li>
                </ul>
            </details>

            <!-- Section 2 -->
            <details>
                <summary>General Exercises</summary>
                <ul class="subsection-list">
                    <li class="exercise-item" onclick="loadContent('ex3')">Exercise 3: Data Parsing</li>
                </ul>
            </details>

        </div>
    </aside>

    <!-- Right Content Viewer (Split Pane 2) -->
    <main>
        <div class="content-card" id="display-area">
            <h1>Welcome!</h1>
            <p>Select an exercise from the left sidebar to view its description and code.</p>
        </div>
    </main>

    <!-- JavaScript to Handle Dynamic Content Loading -->
    <script>
        const exercises = {
            'ex1': {
                title: "Exercise 1: Monte Carlo Simulation",
                desc: "Simulating estimators and analyzing small-sample properties using MATLAB scripts.",
                code: "% MATLAB Monte Carlo Example\nR = 1000;\nbeta_hat = zeros(R, 1);\nfor i = 1:R\n    % generate data and estimate\nend",
                repo: "https://github.com"
            },
            'ex2': {
                title: "Exercise 2: Bootstrap Methods",
                desc: "Implementing non-parametric and residual bootstrap loops for confidence interval calculations.",
                code: "% MATLAB Bootstrap Loop\nboot_samples = datasample(data, [size(data,1), R]);",
                repo: "https://github.com"
            },
            'ex3': {
                title: "Exercise 3: Data Parsing",
                desc: "Reading macro-economic data matrices and handling missing values.",
                code: "data = readtable('dataset.csv');\nclean_data = rmmissing(data);",
                repo: "https://github.com"
            }
        };

        function loadContent(id) {
            const data = exercises[id];
            if (!data) return;

            const displayArea = document.getElementById('display-area');
            displayArea.innerHTML = `
                <h1>${data.title}</h1>
                <p>${data.desc}</p>
                <div class="code-preview">${escapeHtml(data.code)}</div>
                <a href="${data.repo}" target="_blank" class="btn">View Repository on GitHub</a>
            `;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
