<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Exercise Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Outer Page Background */
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #222;
            padding: 30px 20px;
            min-height: 100vh;
        }

        /* Flat Rectangular Main Wrapper Container */
        .page-wrapper {
            display: flex;
            max-width: 1050px;
            height: 85vh;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #cccccc; /* Clean flat border */
            border-radius: 0;          /* Sharp rectangular corners */
            box-shadow: none;          /* Completely flat, no shadows */
        }

        /* Left Sidebar Styling */
        aside {
            width: 300px;
            background-color: #fdfdfd;
            border-right: 1px solid #cccccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 18px 20px;
            background-color: #333333;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid #cccccc;
        }

        .menu-container {
            padding: 12px;
        }

        /* Collapsible Section Details */
        details {
            margin-bottom: 8px;
        }

        summary {
            padding: 8px 10px;
            font-weight: bold;
            background-color: #f0f0f0;
            border: 1px solid #dcdcdc;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.95rem;
        }

        summary:hover {
            background-color: #e5e5e5;
        }

        /* Subsections & Exercise List */
        .subsection-list {
            list-style: none;
            padding-left: 12px;
            margin-top: 6px;
        }

        .exercise-item {
            padding: 7px 10px;
            margin-bottom: 3px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.88rem;
        }

        .exercise-item:hover {
            background-color: #222222;
            color: #ffffff;
            border-color: #222222;
        }

        /* Right Content Area Styling */
        main {
            flex-grow: 1;
            padding: 35px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .content-card {
            max-width: 700px;
        }

        h1 { margin-bottom: 12px; color: #111111; font-size: 1.5rem; }
        p { line-height: 1.5; color: #444444; margin-bottom: 18px; font-size: 0.95rem; }
        
        .code-preview {
            background-color: #f4f4f4;
            border: 1px solid #cccccc;
            border-radius: 0;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            margin-bottom: 18px;
        }

        .btn {
            display: inline-block;
            padding: 7px 14px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 0;
            font-size: 0.9rem;
        }
        .btn:hover { background-color: #555555; }
    </style>
</head>
<body>

    <!-- Flat Centered Wrapper -->
    <div class="page-wrapper">

        <!-- Left Sidebar with Accordions -->
        <aside>
            <div class="sidebar-header">My Exercises</div>
            <div class="menu-container">

                <!-- Section 1 -->
                <details open>
                    <summary>Econometrics & MATLAB</summary>
                    <ul class="subsection-list">
                        <li class="exercise-item" onclick="loadContent('ex1')">Exercise 1: Monte Carlo Simulation</li>
                        <li class="exercise-item" onclick="loadContent('ex2')">Exercise 2: Bootstrap Methods</li>
                    </ul>
                </details>

                <!-- Section 2 -->
                <details>
                    <summary>General Exercises</summary>
                    <ul class="subsection-list">
                        <li class="exercise-item" onclick="loadContent('ex3')">Exercise 3: Data Parsing</li>
                    </ul>
                </details>

            </div>
        </aside>

        <!-- Right Dynamic Content Viewer -->
        <main>
            <div class="content-card" id="display-area">
                <h1>Welcome!</h1>
                <p>Select an exercise from the left sidebar to view its description and code.</p>
            </div>
        </main>

    </div>

    <!-- JavaScript to Handle Dynamic Content Loading -->
    <script>
        const exercises = {
            'ex1': {
                title: "Exercise 1: Monte Carlo Simulation",
                desc: "Simulating estimators and analyzing small-sample properties using MATLAB scripts.",
                code: "% MATLAB Monte Carlo Example\nR = 1000;\nbeta_hat = zeros(R, 1);\nfor i = 1:R\n    % generate data and estimate\nend",
                repo: "https://github.com"
            },
            'ex2': {
                title: "Exercise 2: Bootstrap Methods",
                desc: "Implementing non-parametric and residual bootstrap loops for confidence interval calculations.",
                code: "% MATLAB Bootstrap Loop\nboot_samples = datasample(data, [size(data,1), R]);",
                repo: "https://github.com"
            },
            'ex3': {
                title: "Exercise 3: Data Parsing",
                desc: "Reading macro-economic data matrices and handling missing values.",
                code: "data = readtable('dataset.csv');\nclean_data = rmmissing(data);",
                repo: "https://github.com"
            }
        };

        function loadContent(id) {
            const data = exercises[id];
            if (!data) return;

            const displayArea = document.getElementById('display-area');
            displayArea.innerHTML = `
                <h1>${data.title}</h1>
                <p>${data.desc}</p>
                <div class="code-preview">${escapeHtml(data.code)}</div>
                <a href="${data.repo}" target="_blank" class="btn">View Repository on GitHub</a>
            `;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
